project:
  type: book
  output-dir: docs

book:
  title: "Simulation and Optimization: A Model-Driven Approach"
  author: "Rubén Ruiz-Torrubiano"
  cover-image: images/book-cover.png
  favicon: images/book-cover.png
  site-url: https://simuloptibook.github.io/
  repo-url: https://github.com/simuloptibook/simuloptibook.github.io
  repo-actions: [edit, issue]
  search: true
  downloads: [pdf]
  date: today
  date-format: medium
  chapters:
    - index.qmd
    - preface.qmd
    - intro.qmd
    - part: "PART I: SIMULATION"
      chapters:
        - simulation_basics.qmd
        - monte_carlo.qmd
        - discrete_event.qmd
    - part: "PART II: OPTIMIZATION"
      chapters:
        - optimization_basics.qmd
        - exact_methods.qmd
        - metaheuristics.qmd
    - optimization_in_ml.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib


format:
  html:
    default-image-extension: png
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    code-copy: true
    code-overflow: wrap
    toc: true
  pdf:
    documentclass: scrbook
    default-image-extension: png
    classoption:
      - open=any
    toc: true
    colorlinks: true
    header-includes: |
      \titlehead{
        \begin{center}
        \includegraphics[width=0.48\textwidth]{images/book-cover.png}
        \end{center}
      }



